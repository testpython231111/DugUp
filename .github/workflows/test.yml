name: Tests

# Vercel deploys every push to main without running the tests, so GitHub runs them instead.
# The daily run catches date-based deadlines (e.g. "freeze the rotation") even when nobody pushes.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm test
