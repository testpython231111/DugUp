name: Monthly rarity and summaries

# Runs tools/rarity.mjs, then tools/summaries.mjs (the order matters: summaries picks the rare
# answers from the new rarity), runs the tests and opens a pull request. Nothing reaches main
# until the owner merges it (Spec 13).
on:
  schedule:
    - cron: '0 6 22 * *'   # the 22nd of every month, after the daily test run
  workflow_dispatch:

permissions:
  contents: write        # push the data branch
  pull-requests: write   # open the pull request
  actions: write         # start the Tests workflow on that branch

concurrency:
  group: monthly-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26

      # Both scripts write nothing and exit 1 when more than 5 % of the requests fail.
      - run: node tools/rarity.mjs
      - run: node tools/summaries.mjs
      - run: npm test

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- js/data/rarity.js js/data/summaries.js; then
            echo "rarity.js and summaries.js are unchanged. Nothing to do."
            exit 0
          fi
          month=$(date -u +%Y-%m)
          branch="data/monthly-$month"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add js/data/rarity.js js/data/summaries.js
          git commit -m "Monthly rarity and summaries update ($month)"
          git push --force origin "$branch"
          if ! gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr create --base main --head "$branch" \
              --title "Monthly rarity and summaries update ($month)" \
              --body "Generated by \`.github/workflows/monthly-data.yml\` (Spec 13): \`tools/rarity.mjs\`, then \`tools/summaries.mjs\`, then \`npm test\` (green). Check the diff and merge."
          fi
          # A push made with GITHUB_TOKEN does not start other workflows, so start Tests by hand.
          # Its "test" check then shows up on the pull request.
          gh workflow run test.yml --ref "$branch"
